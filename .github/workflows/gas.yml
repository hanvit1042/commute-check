name: gas
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyproj
      - run: python gas.py
      - run: |
          git config user.name "gas-bot"
          git config user.email "gas-bot@users.noreply.github.com"
          git add gas.json
          git commit -m "update gas prices" || echo "no change"
          git push

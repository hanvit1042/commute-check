<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>출퇴근 교통 확인</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f4f6f9;--card:#fff;--fg:#17212b;--sub:#5b6773;--line:#dde3ea;--main:#1f3a5f;--onmain:#fff;--ok:#1e7e46;--okbg:#e4f4ea;--warn:#a65f00;--warnbg:#fff1d6;--bad:#b3261e;--badbg:#fde7e5}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10161d;--card:#18212b;--fg:#eaf0f6;--sub:#9aa7b4;--line:#2a3643;--main:#5d8fcf;--onmain:#0b1219;--ok:#6fd195;--okbg:#14301f;--warn:#f0b24c;--warnbg:#33260d;--bad:#ff8d85;--badbg:#3a1613}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
main{max-width:640px;margin:0 auto}
h1{font-size:24px;margin:8px 0 4px}
.sub{color:var(--sub);font-size:15px;margin:0 0 20px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;min-height:68px;background:var(--main);color:var(--onmain);cursor:pointer}
button:disabled{opacity:.55}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);min-height:44px;font-weight:500;font-size:15px;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.banner{border-radius:14px;padding:16px;margin-top:16px;font-weight:700;font-size:20px}
.banner small{display:block;font-weight:400;font-size:15px;margin-top:2px}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}
h2{font-size:18px;margin:0 0 8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.row>span:first-child{min-width:0;overflow-wrap:anywhere}
.chip{white-space:nowrap;font-weight:700;border-radius:999px;padding:0 12px;font-size:15px;align-self:flex-start}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-bad{background:var(--badbg);color:var(--bad)}
.ev{padding:10px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.ev:first-of-type{border-top:0}
.ev b{display:block}.ev span{color:var(--sub);font-size:15px}
.muted{color:var(--sub);font-size:15px}
input{font:inherit;width:100%;min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 12px;margin:8px 0 12px}
label{display:block;font-weight:700;font-size:15px;margin-top:8px}
.pin{display:inline-block;background:var(--main);color:var(--onmain);border:2px solid #fff;border-radius:999px;padding:2px 10px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.4)}
#map{height:62vh;min-height:320px;border-radius:14px;border:1px solid var(--line);margin-top:16px;z-index:0}
.legend{font-size:14px;color:var(--sub);margin:8px 2px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin:0 4px 0 10px}
.dot:first-child{margin-left:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>출퇴근 교통 확인</h1>
<p class="sub">버튼을 누르면 지금 내 경로의 사고·공사·정체를 확인합니다.</p>

<section id="setup" class="card" hidden>
  <h2>설정</h2>
  <p class="muted">입력한 내용은 이 폰에만 저장됩니다.</p>
  <label for="key">ITS 인증키</label>
  <input id="key" type="text" inputmode="latin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="인증키 32자리">
  <label for="kakao">카카오 REST API 키 (우회 판단용)</label>
  <input id="kakao" type="text" inputmode="latin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="카카오 REST API 키 32자리">
  <label for="home">집 위치</label>
  <input id="home" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="구글지도 플러스 코드 또는 좌표">
  <label for="work">회사 위치</label>
  <input id="work" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="구글지도 플러스 코드 또는 좌표">
  <p id="err" class="muted" hidden></p>
  <button id="saveKey" style="width:100%">저장</button>
</section>

<section id="main" hidden>
  <div class="btns">
    <button id="go">출근 확인<br><small style="font-weight:400;font-size:14px">집 → 회사</small></button>
    <button id="back">퇴근 확인<br><small style="font-weight:400;font-size:14px">회사 → 집</small></button>
  </div>
  <div id="out"></div>
  <p style="margin-top:28px"><button class="ghost" id="resetKey">설정 변경</button></p>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// 지도 조회 범위: 인천 연수구 ~ 서울 강서구
var BOX = {minX:126.62, maxX:126.95, minY:37.38, maxY:37.58};
var BASE = 'https://openapi.its.go.kr:9443/';

// 경로별 확인 도로. ev: 사고·공사 글에서 찾을 이름, tr: 소통(속도)에서 찾을 도로명, hw: 고속도로 여부
var ROUTES = {
  go:   {name:'출근 · 집 → 회사', alt:'우회 후보: 경인고속도로 경유',
         roads:[{n:'제2경인고속도로',ev:['제2경인'],tr:['제2경인'],hw:1,part:1},{n:'송내대로',ev:['송내대로'],tr:['송내대로']},{n:'봉오대로',ev:['봉오대로'],tr:['봉오대로']},{n:'오정로',ev:['오정로'],tr:['오정로']},{n:'남부순환로',ev:['남부순환'],tr:['남부순환로']}]},
  back: {name:'퇴근 · 회사 → 집', alt:'우회 후보: 송내대로 경유',
         roads:[{n:'남부순환로',ev:['남부순환'],tr:['남부순환로']},{n:'경인고속도로',ev:['경인고속','경인선'],tr:['경인고속도로'],hw:1},{n:'수도권제1순환',ev:['수도권제1순환','외곽순환'],tr:['수도권제1순환','서울외곽'],hw:1,part:1},{n:'제2경인고속도로',ev:['제2경인'],tr:['제2경인'],hw:1,part:1},{n:'송내대로',ev:['송내대로'],tr:['송내대로']}]}
};

var $ = function(id){return document.getElementById(id)};
var DEF={its:'aef6b38654b645d5872f7e4bb9ca96d4',kakao:'5de42f394edc6af395c01545d4ced86a'};
function load(){try{return localStorage.getItem('itsKey')||DEF.its}catch(e){return DEF.its}}
function save(v){try{localStorage.setItem('itsKey',v)}catch(e){}}
function clear(){try{localStorage.removeItem('itsKey')}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

var EDIT=false;
function get(n){try{return localStorage.getItem(n)||''}catch(e){return ''}}
function put(n,v){try{localStorage.setItem(n,v)}catch(e){}}
function show(){var open=!(get('itsHome')&&get('itsWork'))||EDIT;$('setup').hidden=!open;$('main').hidden=open}

// 좌표("37.40, 126.68") 또는 구글 플러스 코드("8Q98CM5J+H5Q")를 [위도, 경도]로 바꿉니다
function parsePos(s){
  var m=s.match(/^(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)$/);
  if(m)return [parseFloat(m[1]),parseFloat(m[2])];
  var A='23456789CFGHJMPQRVWX', c=s.toUpperCase().replace(/\s/g,'');
  if(c.indexOf('+')!==8||c.length<11)return null;
  c=c.replace('+','');
  var lat=-90,lng=-180,res=20,k;
  for(k=0;k<10;k+=2){var a=A.indexOf(c[k]),b=A.indexOf(c[k+1]);if(a<0||b<0)return null;lat+=a*res;lng+=b*res;if(k<8)res/=20}
  var ls=res,gs=res;
  for(k=10;k<c.length;k++){var v=A.indexOf(c[k]);if(v<0)return null;ls/=5;gs/=4;lat+=Math.floor(v/4)*ls;lng+=(v%4)*gs}
  return [lat+ls/2,lng+gs/2];
}

$('saveKey').onclick=function(){
  var v=$('key').value.trim()||load(), h=$('home').value.trim(), w=$('work').value.trim(), kk=$('kakao').value.trim()||get('kakaoKey')||DEF.kakao, er=$('err');
  if(v.length<16){er.textContent='인증키를 입력해 주세요.';er.hidden=false;return}
  if((h&&!parsePos(h))||(w&&!parsePos(w))){er.textContent='위치 형식을 확인해 주세요. (예: 8Q98CM5J+H5Q 또는 37.40, 126.68)';er.hidden=false;return}
  save(v);put('kakaoKey',kk);put('itsHome',h);put('itsWork',w);er.hidden=true;EDIT=false;$('key').value='';$('kakao').value='';show()
};
$('resetKey').onclick=function(){EDIT=true;$('key').value='';$('kakao').value='';$('home').value=get('itsHome');$('work').value=get('itsWork');show()};
$('go').onclick=function(){run('go')};
$('back').onclick=function(){run('back')};

async function call(path, params, key, ms){
  var u=BASE+path+'?apiKey='+encodeURIComponent(key)+'&'+params+'&getType=json';
  var c=new AbortController();var t=setTimeout(function(){c.abort()},ms||20000);
  try{
    var r=await fetch(u,{signal:c.signal});
    var j=await r.json();
    if(j.header&&j.header.resultCode!==0){throw new Error(j.header.resultMsg||'조회 실패')}
    return (j.body&&j.body.items)||[];
  }finally{clearTimeout(t)}
}


// 카카오 길찾기: 지금 교통 기준 예상 시간으로 평소 길 vs 우회 길 비교
var USUAL = {go:'sn', back:'gi'};
var KIND = {sn:'송내대로 경유', gi:'경인·제1순환 경유'};
async function verdict(which){
  var kk=get('kakaoKey')||DEF.kakao, H=parsePos(get('itsHome')), W=parsePos(get('itsWork'));
  if(!kk||!H||!W)return '<div class="card muted">우회 판단을 쓰려면 아래 "설정 변경"에서 카카오 키와 집·회사 위치를 입력해 주세요.</div>';
  var o=which==='go'?H:W, d=which==='go'?W:H;
  var u='https://apis-navi.kakaomobility.com/v1/directions?origin='+o[1]+','+o[0]+'&destination='+d[1]+','+d[0]+'&priority=RECOMMEND&alternatives=true&road_details=false';
  var c=new AbortController();var t=setTimeout(function(){c.abort()},15000);
  try{
    var r=await fetch(u,{headers:{Authorization:'KakaoAK '+kk},signal:c.signal});
    var j=await r.json();
    if(!j.routes||!j.routes.length)throw new Error(j.msg||'경로 없음');
    var best={};
    j.routes.forEach(function(rt){
      if(!rt.summary)return;
      var m={};(rt.sections||[]).forEach(function(s){(s.roads||[]).forEach(function(x){m[x.name]=(m[x.name]||0)+x.distance})});
      var kind='x';
      if((m['송내대로']||0)>2000)kind='sn';
      else if((m['경인고속도로']||0)+(m['수도권제1순환고속도로']||0)>3000)kind='gi';
      var min=Math.round(rt.summary.duration/60);
      if(!best[kind]||min<best[kind])best[kind]=min;
    });
    var us=USUAL[which], al=us==='sn'?'gi':'sn';
    if(best[us]==null||best[al]==null){
      var f=Math.min.apply(null,Object.keys(best).map(function(k){return best[k]}));
      return '<div class="banner b-ok">지금 예상 '+f+'분<small>평소 길과 우회 길을 구분하지 못했습니다. 아래 사고·공사를 참고하세요.</small></div>';
    }
    var diff=best[us]-best[al];
    if(diff>=5)return '<div class="banner b-bad">'+KIND[al]+'으로 가세요<small>평소 길 '+best[us]+'분 → 우회 '+best[al]+'분 · <b>'+diff+'분 빠름</b></small></div>';
    return '<div class="banner b-ok">평소 길로 가세요<small>'+KIND[us]+' '+best[us]+'분 · 우회 '+KIND[al]+' '+best[al]+'분</small></div>';
  }catch(e){
    return '<div class="card muted">우회 판단을 불러오지 못했습니다. 카카오 키를 확인해 주세요.</div>';
  }finally{clearTimeout(t)}
}

var MAP=null;
function drawMap(events,mine){
  var box=$('map');
  if(!box)return;
  if(typeof L==='undefined'){box.outerHTML='<div class="card muted">지도를 불러오지 못했습니다</div>';return}
  if(MAP){MAP.remove();MAP=null}
  MAP=L.map('map').fitBounds([[BOX.minY,BOX.minX],[BOX.maxY,BOX.maxX]]);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(MAP);
  [['집','itsHome'],['회사','itsWork']].forEach(function(p){
    var pos=parsePos(get(p[1]));
    if(!pos)return;
    L.marker(pos,{icon:L.divIcon({className:'',html:'<div class="pin">'+p[0]+'</div>',iconSize:null,iconAnchor:[18,12]}),zIndexOffset:1000}).addTo(MAP);
  });
  var set=new Set(mine);
  var list=events.slice().sort(function(a,b){return (set.has(a)?1:0)-(set.has(b)?1:0)});
  list.forEach(function(e){
    var x=parseFloat(e.coordX),y=parseFloat(e.coordY);
    if(isNaN(x)||isNaN(y))return;
    var my=set.has(e),acc=e.eventType==='교통사고';
    L.circleMarker([y,x],{radius:my?12:5,color:my?'#ffffff':'#777777',weight:my?3:1,fillColor:acc?'#d93025':(my?'#f29900':'#9aa0a6'),fillOpacity:my?0.95:0.6})
      .bindPopup('<b>'+esc(e.eventType)+' · '+esc(e.roadName)+' '+esc(e.roadDrcType||'')+'</b><br>'+esc(e.message||e.eventDetailType||'')+'<br>'+hhmm(e.startDate)+' 발생')
      .addTo(MAP);
  });
}

function state(avg,hw){var a=hw?[60,40]:[30,20];return avg>=a[0]?['원활','c-ok',0]:avg>=a[1]?['서행','c-warn',1]:['정체','c-bad',2]}
function hhmm(s){return s&&s.length>=12?s.slice(4,6)+'/'+s.slice(6,8)+' '+s.slice(8,10)+':'+s.slice(10,12):''}

async function run(which){
  var key=load(), R=ROUTES[which], out=$('out');
  $('go').disabled=$('back').disabled=true;
  out.innerHTML='<div class="card muted">조회 중입니다…</div>';
  var vp=verdict(which);
  try{
    var box='minX='+BOX.minX+'&maxX='+BOX.maxX+'&minY='+BOX.minY+'&maxY='+BOX.maxY;
    var tf=false;
    var res=await Promise.all([
      call('eventInfo','type=all&eventType=all&'+box,key),
      call('trafficInfo','type=all&drcType=all&'+box,key,50000).catch(function(){tf=true;return []})
    ]);
    var events=res[0], traffic=res[1];

    // 내 도로에 해당하는 사고·공사
    var mine=events.filter(function(e){
      return R.roads.some(function(r){return r.ev.some(function(k){return (e.roadName||'').indexOf(k)>-1||(e.message||'').indexOf(k)>-1})});
    });
    var acc=mine.filter(function(e){return e.eventType==='교통사고'});

    // 도로별 평균 속도
    var worst=0, rows=[], none=[];
    R.roads.forEach(function(r){
      var s=0,n=0;
      traffic.forEach(function(t){
        var nm=t.roadName||'', v=parseFloat(t.speed);
        if(isNaN(v)) return;
        var hit=r.tr.some(function(k){return r.hw?nm.indexOf(k)>-1:nm===k});
        if(hit){s+=v;n++}
      });
      if(!n){none.push(r.n);return}
      var avg=s/n, st=state(avg,r.hw);
      if(st[2]>worst)worst=st[2];
      rows.push('<div class="row"><span>'+esc(r.n)+(r.part?' <span class="muted">(일부 구간)</span>':'')+'<br><span class="muted">평균 '+avg.toFixed(0)+'km/h</span></span><span class="chip '+st[1]+'">'+st[0]+'</span></div>');
    });

    var level=(acc.length||worst===2)?2:(mine.length||worst===1)?1:0;
    var cls=['b-ok','b-warn','b-bad'][level];
    var title=['이상 없음','주의가 필요합니다','우회를 검토하세요'][level];
    var line=acc.length?('교통사고 '+acc.length+'건'):'';
    if(mine.length-acc.length>0){line+=(line?' · ':'')+'공사·기타 '+(mine.length-acc.length)+'건'}
    if(!line)line='내 도로에서 확인된 사고·공사가 없습니다';
    var h=await vp;
    h+='<div class="banner '+cls+'">'+title+'<small>'+esc(R.name)+' · '+line+'</small></div>';
    h+='<div id="map"></div><p class="legend"><span class="dot" style="background:#d93025"></span>사고<span class="dot" style="background:#f29900"></span>공사·기타<span class="dot" style="background:#9aa0a6"></span>내 도로 아님 (큰 핀이 내 도로)</p>';

    h+='<div class="card"><h2>도로 소통</h2>'+(rows.join('')||'<span class="muted">'+(tf?'소통 자료를 불러오지 못했습니다. 다시 눌러 보세요.':'소통 자료가 없습니다')+'</span>')+(none.length&&!tf?'<p class="muted" style="margin:10px 0 0">자료 없음: '+esc(none.join(', '))+'</p>':'')+'</div>';

    h+='<div class="card"><h2>사고·공사</h2>';
    if(!mine.length){h+='<span class="muted">해당 없음</span>'}
    else mine.slice(0,15).forEach(function(e){
      h+='<div class="ev"><b>'+esc(e.eventType)+' · '+esc(e.roadName)+' '+esc(e.roadDrcType||'')+'</b>'+esc(e.message||e.eventDetailType||'')+(e.lanesBlocked?'<br><span>'+esc(e.lanesBlocked)+'</span>':'')+'<br><span>'+hhmm(e.startDate)+' 발생</span></div>';
    });
    h+='</div>';
    h+='<p class="muted">기준 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' · 구간 전체 사고·공사 '+events.length+'건 중 내 도로 '+mine.length+'건</p>';
    out.innerHTML=h;
    drawMap(events,mine);
  }catch(err){
    var m=String(err&&err.message||err);
    out.innerHTML=(await vp)+'<div class="banner b-bad">조회하지 못했습니다<small>'+esc(/4005|인증/.test(m)?'인증키를 확인해 주세요. 아래 "설정 변경"에서 다시 입력할 수 있습니다.':'잠시 후 다시 눌러 주세요. ('+m+')')+'</small></div>';
  }finally{$('go').disabled=$('back').disabled=false}
}
show();
</script>
</body>
</html>
